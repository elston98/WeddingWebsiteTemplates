<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>John &amp; Jess — We're Getting Married</title>
<meta name="description" content="John &amp; Jess are getting married. Open your invitation.">
<meta name="theme-color" content="#EEF3F9">

<link rel="preload" href="images/envelope-front.webp" as="image">
<link rel="preload" href="images/envelope-back.webp" as="image">
<link rel="preload" href="images/envelope-pocket.webp" as="image">
<link rel="preload" href="images/card-monogram.webp" as="image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&family=Sacramento&display=swap">

<style>
/* ══════════════════ TOKENS ══════════════════ */
:root{
  --mist:#EEF3F9; --paper:#FFFDF9;
  --royal:#145AAE; --royal-deep:#0A3C82; --royal-ink:#123A6B;
  --gold:#BF9450; --gold-dark:#A27A3C; --gold-soft:#E0C48E;
  --blush:#F8EFEC; --slate:#5B6886; --tan:#C39463;
  --ink-soft:#4A6283;
  --serif:"Cormorant Garamond", Georgia, serif;
  --script:"Sacramento", cursive;
  --env-w:min(420px, 86vw);
  /* leaf patterns and sprigs are generated in the script below */
  --lf-back:none; --lf-liner:none; --lf-gold:none;
  --sprig-white:none; --sprig-gold:none; --bouquet:none;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--serif); color:var(--royal-ink);
  background:var(--mist);
  -webkit-font-smoothing:antialiased;
}
body.intro-active{overflow:hidden}

/* ══════════════════ INTRO ══════════════════ */
.intro{
  position:fixed; inset:0; z-index:100;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 50% 45%, #FFFFFF 0%, var(--mist) 65%, #DFE8F3 100%);
  cursor:pointer; overflow:hidden;
  transition:opacity .9s ease .5s, visibility 0s linear 1.4s;
}
.intro.is-gone{opacity:0; visibility:hidden}
/* hold the envelope back until the script font has loaded, so the names never flash in a fallback font */
.scene{opacity:0; transition:opacity .5s ease}
.intro.is-ready .scene{opacity:1}

.greeting{
  position:absolute; top:max(7vh, 24px); left:16px; right:16px;
  font-style:italic; font-size:clamp(1.05rem, 3.6vw, 1.3rem); color:var(--ink-soft);
  text-align:center;
  opacity:0; transform:translateY(8px);
  transition:opacity .8s ease, transform .8s ease;
}
.greeting strong{font-weight:600; font-style:normal; color:var(--royal-ink)}
.intro.is-ready .greeting{opacity:1; transform:none}
.intro.is-rising .greeting{opacity:0}

.hint{
  position:absolute; bottom:max(7vh, 24px); left:50%; transform:translateX(-50%);
  font-size:.82rem; letter-spacing:.32em; text-transform:uppercase; color:var(--ink-soft);
  background:none; border:0; font-family:inherit; cursor:pointer; white-space:nowrap;
  padding:.6em 1em;
  opacity:0; transition:opacity .8s ease;
}
.hint:focus-visible{outline:1px solid var(--gold); outline-offset:4px}
.intro.is-card .hint{opacity:1; animation:pulse 2.4s ease-in-out 1s infinite}
@keyframes pulse{50%{opacity:.4}}

/* the envelope lives in .scene; front and back are two views swapped mid-turn */
.scene{
  position:relative; width:var(--env-w); height:calc(var(--env-w) * .66);
  margin-top:calc(var(--env-w) * .3);
  perspective:1600px;
}
.view{position:absolute; inset:0; transition:transform .45s}

.royal{
  background:
    var(--lf-back) 0 0 / 200px,
    var(--lf-back) 100px 100px / 200px,
    linear-gradient(160deg, #1D66B9, var(--royal) 45%, var(--royal-deep));
}
.liner{
  background:
    var(--lf-liner) 0 0 / 150px,
    var(--lf-liner) 75px 75px / 150px,
    #F7F0E6;
}

/* — front of the envelope (closed, shown on load) — */
.view.front{
  border-radius:4px; display:grid; place-items:center;
  background:url(images/envelope-front.webp) center / cover, var(--royal);
  box-shadow:0 22px 44px -14px rgba(10,60,130,.5), 0 4px 10px rgba(10,60,130,.18);
  transition-timing-function:cubic-bezier(.55,0,1,.45);
}
.intro.is-turning .view.front{transform:rotateY(90deg)}

/* — back of the envelope (flap side) — */
.view.back{
  perspective:1400px;
  transform:rotateY(-90deg);
  transition-timing-function:cubic-bezier(0,.55,.45,1);
}
.intro.is-turned .view.back{transform:none}

.env-shell{
  position:absolute; inset:0; border-radius:4px;
  box-shadow:0 22px 44px -14px rgba(10,60,130,.5), 0 4px 10px rgba(10,60,130,.18);
}
.env-shell .liner{position:absolute; left:4.5%; right:4.5%; top:5%; bottom:38%; border-radius:2px}

.env-front{
  position:absolute; inset:0; z-index:3; border-radius:4px; overflow:hidden;
  pointer-events:none;
}
/* the closed back is the supplied artwork, cut along its gold flap edge:
   the pocket is everything below the edge, the flap everything above it */
.art{background:url(images/envelope-back.webp) 0 0 / var(--env-w) calc(var(--env-w) * .66) no-repeat var(--royal)}
.env-front .pocket{position:absolute; inset:0; -webkit-clip-path:url(#pocketClip); clip-path:url(#pocketClip)}
/* once open, the pocket and card switch to the open-envelope artwork (images/envelope-pocket.webp,
   images/card-monogram.webp); the open flap fades away as it does not appear in that artwork */
.env-front .pocket, .env-front .pocket-open, .flap-face{transition:opacity .6s ease}
.env-front .pocket-open{
  position:absolute; inset:0; opacity:0;
  background:url(images/envelope-pocket.webp) center / 100% 100% no-repeat;
}
.intro.is-swapped .env-front .pocket{opacity:0}
.intro.is-swapped .env-front .pocket-open{opacity:1}
.intro.is-swapped .flap-face.open{opacity:0}

/* top flap — shape comes from the SVG clip paths in the page */
.flap{position:absolute; left:0; right:0; top:0; height:51.5%}
.flap{
  z-index:5; transform-origin:top center; transform-style:preserve-3d;
  transition:transform 1s cubic-bezier(.45,0,.55,1), z-index 0s linear .5s;
}
.flap-face{position:absolute; inset:0; -webkit-backface-visibility:hidden; backface-visibility:hidden}
/* iOS Safari can show a face's back side anyway, so the faces are also swapped
   by visibility exactly halfway through each flip (the flips use symmetric easing) */
.flap-face.open{visibility:hidden}
.intro.is-open .flap-face.outside{visibility:hidden; transition:visibility 0s linear .5s, opacity .6s ease}
.intro.is-open .flap-face.open{visibility:visible; transition:visibility 0s linear .5s, opacity .6s ease}
.flap-face.outside{-webkit-clip-path:url(#flapClip); clip-path:url(#flapClip)}
.flap-face.open{ /* what shows once the flap stands up: blue with a white sprig */
  transform:rotateX(180deg);
  -webkit-clip-path:url(#flapClipOpen); clip-path:url(#flapClipOpen);
}
.flap-face.open::after{
  content:""; position:absolute; left:50%; top:8%; width:22%; height:72%;
  transform:translateX(-50%);
  background:var(--sprig-white) center / contain no-repeat;
}
.intro.is-open .flap{transform:rotateX(180deg); z-index:1}

/* — the card — */
.card{
  position:absolute; left:6%; right:6%; bottom:4%; aspect-ratio:1048 / 637;
  z-index:2; transform-style:preserve-3d;
  transition:transform 1.1s cubic-bezier(.3,.7,.3,1);
}
.intro.is-lifted .card{z-index:10}
.intro.is-card .card{transition:transform 1.3s cubic-bezier(.45,0,.55,1)}
.card-face.inside{visibility:hidden}
.intro.is-card .card-face.back{visibility:hidden; transition:visibility 0s linear .65s}
.intro.is-card .card-face.inside{visibility:visible; transition:visibility 0s linear .65s}
.card-face{
  position:absolute; inset:0; border-radius:3px; overflow:hidden;
  background:var(--blush); -webkit-backface-visibility:hidden; backface-visibility:hidden;
  box-shadow:0 2px 10px rgba(10,60,130,.2);
}
.intro.is-card .card-face{box-shadow:0 24px 50px -18px rgba(10,60,130,.45), 0 2px 8px rgba(10,60,130,.12)}
.card-face.inside{transform:rotateY(180deg) translateZ(1px)}
.card-face.back{transform:translateZ(1px)}

/* back of the card: the JJ monogram card from the open-envelope artwork */
.card-face.back{background:url(images/card-monogram.webp) center / 100% 100% no-repeat #F7F0E6}

/* invitation side: text on the left, gold florals bleeding off the right */
.bouquet{
  position:absolute; right:-8%; top:-7%; height:114%; aspect-ratio:3 / 4;
  background:var(--bouquet) center / contain no-repeat;
}
.card-inner{
  position:relative; z-index:1; height:100%; width:68%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; color:var(--slate); padding-left:3%;
}
.card .caps{
  font-size:calc(var(--env-w) * .021); letter-spacing:.16em; text-transform:uppercase; line-height:1.55;
}
.card .nowrap{white-space:nowrap; letter-spacing:.1em}
.card .couple{
  font-family:var(--script); font-weight:400; white-space:nowrap;
  font-size:calc(var(--env-w) * .1); line-height:1; margin:calc(var(--env-w) * .015) 0 calc(var(--env-w) * .02);
}
.card .couple small{font-size:.45em; margin:0 .1em}
.when{
  display:flex; align-items:center; gap:calc(var(--env-w) * .018);
  margin:calc(var(--env-w) * .03) 0 calc(var(--env-w) * .026);
}
.when b{
  font-weight:500; font-size:calc(var(--env-w) * .07); line-height:1;
  border-left:1px solid var(--slate); padding-left:calc(var(--env-w) * .018);
}
.when .side{text-align:left}
.when .side + .side{border-left:1px solid var(--slate); padding-left:calc(var(--env-w) * .018)}
.when .side strong{font-weight:600}

/* envelope drops away once the card is out */
.intro.is-card .env-shell,
.intro.is-card .env-front,
.intro.is-card .flap{
  transform:translateY(70vh); opacity:0;
  transition:transform 1s cubic-bezier(.5,0,.75,0), opacity .9s ease;
}
.intro.is-card .flap{transform:translateY(70vh) rotateX(180deg)}

/* fade the faces, not the card: opacity on the card itself would flatten its 3D flip */
.intro.is-leaving .card{transition:transform .8s ease}
.intro.is-leaving.is-card .card-face{opacity:0; transition:opacity .7s ease}
.intro.is-leaving .hint{opacity:0; animation:none}

/* ══════════════════ MAIN / FIRST PAGE ══════════════════ */
.hero{
  position:relative; overflow:hidden;
  min-height:100vh; min-height:100svh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:48px 16px; text-align:center;
  background:radial-gradient(ellipse at 50% 35%, #FFFFFF 0%, var(--mist) 75%);
}
.hero::before, .hero::after{ /* gold sprigs in the corners */
  content:""; position:absolute; width:min(150px, 32vw); height:min(380px, 60vh); pointer-events:none;
  background:var(--sprig-gold) center / contain no-repeat; opacity:.8;
}
.hero::before{right:2%; top:-6%; transform:rotate(-150deg)}
.hero::after{left:2%; bottom:-6%; transform:rotate(30deg)}
.hero .eyebrow{font-size:.85rem; letter-spacing:.3em; text-transform:uppercase; color:var(--gold-dark)}
.hero h2{
  font-family:var(--script); font-weight:400; line-height:1; color:var(--royal);
  font-size:clamp(4rem, 16vw, 8rem); margin:.2em 0 .1em;
}
.hero .sub{font-style:italic; font-size:clamp(1.1rem, 3.5vw, 1.4rem); color:var(--ink-soft)}
.hero .divider{width:90px; height:1px; background:var(--gold-soft); margin:28px auto}
.hero .date{font-size:1rem; letter-spacing:.25em; text-transform:uppercase}

body.intro-active .hero > *{opacity:0; transform:translateY(12px)}
.hero > *{transition:opacity 1s ease, transform 1s ease}
.hero > :nth-child(2){transition-delay:.15s}
.hero > :nth-child(3){transition-delay:.3s}
.hero > :nth-child(4){transition-delay:.45s}
.hero > :nth-child(5){transition-delay:.6s}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms !important; transition-delay:0s !important; animation:none !important}
}
</style>

<script>
// Draws leafy branches once and exposes them as CSS variables in each colour used.
(function(){
  function leaf(x, y, deg, L, line, color){
    var w = L * .2;
    var d = 'M0 0C' + L*.3 + ' ' + -w + ' ' + L*.7 + ' ' + -w + ' ' + L + ' 0C' + L*.7 + ' ' + w + ' ' + L*.3 + ' ' + w + ' 0 0Z';
    var t = "transform='translate(" + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + deg.toFixed(1) + ")'";
    return line
      ? "<g " + t + " fill='none' stroke='" + color + "' stroke-width='1'><path d='" + d + "'/><path d='M0 0L" + L*.85 + " 0'/></g>"
      : "<path " + t + " d='" + d + "' fill='" + color + "'/>";
  }
  // stem from (x0,y0) to (x1,y1) bowing by `bend`, with n alternating leaves and one at the tip
  function branch(x0, y0, x1, y1, bend, n, L, line, color){
    var mx = (x0 + x1) / 2, my = (y0 + y1) / 2, len = Math.hypot(x1 - x0, y1 - y0);
    var cx = mx - (y1 - y0) / len * bend, cy = my + (x1 - x0) / len * bend;
    var s = "<path d='M" + x0 + ' ' + y0 + 'Q' + cx + ' ' + cy + ' ' + x1 + ' ' + y1 +
            "' fill='none' stroke='" + color + "' stroke-width='" + (line ? 1 : 1.4) + "'/>";
    for (var i = 1; i <= n + 1; i++){
      var t = i === n + 1 ? 1 : .12 + (i - 1) / n * .82, u = 1 - t;
      var px = u*u*x0 + 2*u*t*cx + t*t*x1, py = u*u*y0 + 2*u*t*cy + t*t*y1;
      var dx = 2*u*(cx - x0) + 2*t*(x1 - cx), dy = 2*u*(cy - y0) + 2*t*(y1 - cy);
      var a = Math.atan2(dy, dx) * 180 / Math.PI;
      var tip = i === n + 1;
      s += leaf(px, py, tip ? a : a + (i % 2 ? 42 : -42), L * (tip ? .8 : 1 - t * .4), line, color);
    }
    return s;
  }
  function uri(w, h, body){
    var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + w + "' height='" + h + "' viewBox='0 0 " + w + ' ' + h + "'>" + body + '</svg>';
    return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
  }
  function pattern(color, line){
    return uri(200, 200,
      branch(10, 190, 150, 40, 24, 7, 34, line, color) +
      branch(195, 150, 120, 195, -10, 3, 26, line, color) +
      branch(30, 10, 95, 60, -10, 3, 22, line, color));
  }
  function sprig(color){
    return uri(80, 220, branch(40, 215, 44, 10, 10, 8, 42, true, color));
  }
  // silhouette flower: petals in `col`, separated by thin lines of the paper colour `bg`
  function bloom(cx, cy, r, rot, col, bg){
    var s = "<g transform='rotate(" + rot + ' ' + cx + ' ' + cy + ")' fill='" + col + "' stroke='" + bg + "' stroke-width='" + (r * .05).toFixed(2) + "'>";
    for (var i = 0; i < 8; i++)
      s += "<ellipse cx='" + cx + "' cy='" + (cy - r * .52) + "' rx='" + r * .4 + "' ry='" + r * .55 + "' transform='rotate(" + i * 45 + ' ' + cx + ' ' + cy + ")'/>";
    for (var j = 0; j < 5; j++)
      s += "<ellipse cx='" + cx + "' cy='" + (cy - r * .26) + "' rx='" + r * .22 + "' ry='" + r * .3 + "' transform='rotate(" + (j * 72 + 18) + ' ' + cx + ' ' + cy + ")'/>";
    return s + "<circle cx='" + cx + "' cy='" + cy + "' r='" + r * .14 + "'/></g>";
  }
  function bouquet(col, bg){
    function sprays(){
      return branch(165, 200, 85, 150, 14, 4, 26, false, col) +
             branch(170, 320, 60, 335, -14, 5, 26, false, col) +
             branch(190, 80, 90, 0, 14, 5, 26, false, col) +
             branch(210, 250, 110, 395, 10, 5, 26, false, col) +
             branch(240, 40, 300, -10, -8, 3, 24, false, col) +
             branch(150, 150, 60, 60, -12, 4, 22, false, col);
    }
    var berries = '';
    [[62, 248], [70, 258], [56, 262], [100, 70], [108, 60], [94, 58], [70, 390], [80, 382]].forEach(function(b){
      berries += "<circle cx='" + b[0] + "' cy='" + b[1] + "' r='4.5' fill='" + col + "'/>";
    });
    return uri(300, 400, sprays() + berries +
      bloom(215, 125, 56, 10, col, bg) + bloom(195, 300, 62, -8, col, bg) +
      bloom(112, 228, 34, 20, col, bg) + bloom(272, 215, 30, 0, col, bg) +
      bloom(128, 118, 22, 15, col, bg) + bloom(98, 352, 24, 5, col, bg) +
      bloom(285, 395, 34, 30, col, bg) + bloom(275, 30, 28, 12, col, bg));
  }
  var root = document.documentElement.style;
  root.setProperty('--lf-back', pattern('rgba(150,195,245,.22)'));
  root.setProperty('--lf-liner', pattern('rgba(62,104,170,.55)'));
  root.setProperty('--sprig-white', sprig('#FFFFFF'));
  root.setProperty('--sprig-gold', sprig('#C29A57'));
  root.setProperty('--bouquet', bouquet('#C39463', '#F8EFEC'));
})();
</script>
</head>
<body class="intro-active">

<!-- Flap and pocket shapes, traced from the gold flap edge in images/envelope-back.webp.
     The open face is drawn flipped because it turns over with the flap. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <clipPath id="flapClip" clipPathUnits="objectBoundingBox">
      <path d="M0,0 L1,0 L0.678,0.772 C0.618,0.92 0.558,1 0.494,1 C0.43,1 0.37,0.92 0.31,0.772 Z"/>
    </clipPath>
    <clipPath id="flapClipOpen" clipPathUnits="objectBoundingBox">
      <path d="M0,1 L1,1 L0.678,0.228 C0.618,0.08 0.558,0 0.494,0 C0.43,0 0.37,0.08 0.31,0.228 Z"/>
    </clipPath>
    <clipPath id="pocketClip" clipPathUnits="objectBoundingBox">
      <path d="M0,0 L0.312,0.388 C0.372,0.464 0.43,0.507 0.494,0.507 C0.558,0.507 0.616,0.464 0.676,0.388 L1,0 L1,1 L0,1 Z"/>
    </clipPath>
  </defs>
</svg>

<!-- ══════════════════ INTRO ══════════════════ -->
<div class="intro" id="intro" aria-label="Your invitation">
  <p class="greeting" id="greeting">You've got mail</p>

  <div class="scene" aria-hidden="true">
    <!-- envelope front: what the guest sees first -->
    <div class="view front"></div>

    <!-- envelope back: flap opens and the card comes out -->
    <div class="view back">
      <div class="env-shell royal"><div class="liner"></div></div>

      <div class="card" id="card">
        <div class="card-face back"></div>
        <div class="card-face inside">
          <i class="bouquet"></i>
          <div class="card-inner">
            <p class="caps">Together with their families</p>
            <h1 class="couple">John <small>and</small> Jess</h1>
            <p class="caps nowrap">invite you to their wedding celebration</p>
            <!-- Placeholder date, time and venue: replace once confirmed -->
            <div class="when caps">
              <b>DD</b>
              <span class="side"><strong>Month</strong><br>Year</span>
              <span class="side"><strong>Day</strong><br>at time</span>
            </div>
            <p class="caps">Venue name<br>Address line<br>City, State</p>
          </div>
        </div>
      </div>

      <div class="env-front">
        <div class="pocket art"></div>
        <div class="pocket-open"></div>
      </div>
      <div class="flap">
        <div class="flap-face outside art"></div>
        <div class="flap-face open royal"></div>
      </div>
    </div>
  </div>

  <button class="hint" id="continue" type="button">Click to continue</button>
</div>

<!-- ══════════════════ MAIN ══════════════════ -->
<main id="main">
  <section class="hero" id="home">
    <p class="eyebrow">Together with their families</p>
    <h2>John &amp; Jess</h2>
    <p class="sub">are getting married</p>
    <div class="divider"></div>
    <p class="date">Date &amp; venue coming soon</p>
  </section>
</main>

<script>
(function(){
  var intro = document.getElementById('intro');
  var card = document.getElementById('card');
  var btn = document.getElementById('continue');

  // Personalise with ?to=Name (e.g. ?to=Aunt%20Mary)
  var guest = new URLSearchParams(location.search).get('to');
  if (guest) {
    var g = document.getElementById('greeting');
    g.textContent = 'Dear ';
    var s = document.createElement('strong');
    s.textContent = guest.trim();
    g.append(s, ', you’ve got mail');
  }

  if ('ontouchstart' in window) btn.textContent = 'Tap to continue';

  function at(ms, fn){ setTimeout(fn, ms); }
  function add(c){ intro.classList.add(c); }

  // Card rises to the half-out pose of the open-envelope artwork (bottom edge 28.4% down the
  // envelope), then lifts just clear of it, then comes to the centre and flips face up.
  function halfOutY(){ return -(card.offsetTop + card.offsetHeight) + card.offsetParent.offsetHeight * .284; }
  function liftY(){ return -(card.offsetTop + card.offsetHeight) - 6; }
  function finalTransform(shift){
    var env = card.offsetParent.getBoundingClientRect();
    var centre = env.top + card.offsetTop + card.offsetHeight / 2;
    var scale = Math.min(1.3, (innerWidth - 32) / card.offsetWidth, innerHeight * .62 / card.offsetHeight);
    return 'translateY(' + (innerHeight / 2 - centre - (shift || 0)) + 'px) rotateY(180deg) scale(' + scale.toFixed(3) + ')';
  }

  // Sequence: closed front (2s) → envelope turns over → flap opens → card rises → card flips
  var started = false;
  function start(){
    if (started) return;
    started = true;
    add('is-ready');
    at(2000, function(){ add('is-turning'); });
    at(2450, function(){ add('is-turned'); });
    at(3100, function(){ add('is-open'); });
    at(3700, function(){ add('is-swapped'); });
    at(3900, function(){ add('is-rising'); card.style.transform = 'translateY(' + halfOutY() + 'px)'; });
    at(5800, function(){ card.style.transform = 'translateY(' + liftY() + 'px)'; });
    at(6700, function(){ add('is-lifted'); });
    at(6800, function(){ add('is-card'); card.style.transform = finalTransform(); });
  }
  if (document.fonts && document.fonts.load) {
    function decoded(src){
      var img = new Image();
      img.src = src;
      return img.decode ? img.decode() : Promise.resolve();
    }
    Promise.all([
      document.fonts.load('1em Sacramento'),
      document.fonts.load('1em "Pinyon Script"'),
      decoded('images/envelope-front.webp'),
      decoded('images/envelope-back.webp'),
      decoded('images/envelope-pocket.webp'),
      decoded('images/card-monogram.webp')
    ]).then(start, start);
    at(2500, start); // don't wait forever on a slow connection
  } else {
    start();
  }

  addEventListener('resize', function(){
    if (intro.classList.contains('is-card') && !intro.classList.contains('is-leaving'))
      card.style.transform = finalTransform();
  });

  var left = false;
  function enter(){
    if (left || !intro.classList.contains('is-card')) return;
    left = true;
    card.style.transform = finalTransform(40);
    add('is-leaving');
    setTimeout(function(){
      add('is-gone');
      document.body.classList.remove('intro-active');
    }, 500);
    setTimeout(function(){ intro.remove(); }, 2100);
  }
  intro.addEventListener('click', enter);
})();
</script>
</body>
</html>
